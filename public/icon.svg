<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="navyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E38" />
      <stop offset="100%" stop-color="#080D1E" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="reflectGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#navyGrad)" />
  
  <!-- Outer Subtle Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#D97706" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />
  
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Geometric Diamond / Matrix Center -->
  <polygon points="256,96 376,256 256,416 136,256" fill="none" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Reflective Intersecting Octagon / Prism -->
  <path d="M 256 160 L 320 224 L 320 288 L 256 352 L 192 288 L 192 224 Z" fill="url(#reflectGrad)" />

  <!-- Inner Core Center of Stillness -->
  <circle cx="256" cy="256" r="28" fill="#FCD34D" />
  <circle cx="256" cy="256" r="14" fill="#0A1128" />
  
  <!-- Compass Cardinal Indicators -->
  <line x1="256" y1="60" x2="256" y2="88" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="424" x2="256" y2="452" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />
  <line x1="60" y1="256" x2="88" y2="256" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />
  <line x1="424" y1="256" x2="452" y2="256" stroke="#FCD34D" stroke-width="5" stroke-linecap="round" />
</svg>
